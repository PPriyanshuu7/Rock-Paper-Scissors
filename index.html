<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS Game Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Rock Paper Scissors ⚡</h1>

    <div class="scoreboard">
      <div>👤 You: <span id="playerScore">0</span></div>
      <div>🤖 AI: <span id="compScore">0</span></div>
    </div>

    <div class="choices">
      <button data-choice="rock">✊</button>
      <button data-choice="paper">🖐️</button>
      <button data-choice="scissors">✌️</button>
    </div>

    <div class="display">
      <p id="playerDisplay">You chose: -</p>
      <p id="compDisplay">AI chose: -</p>
      <h2 id="result">Make your move</h2>
    </div>

    <button id="resetBtn">Reset Game</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
